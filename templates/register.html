{% extends "base.html" %}

{% block title %}Create Account — Placement Readiness Predictor{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--primary);">Create Student Account</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.3rem;">Get instant AI placement readiness score & diagnostics</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Choose username" required autofocus>
      </div>

      <div class="form-group">
        <label for="email">College Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="student@university.edu" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Create password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem;">
        Sign Up & Start Assessment
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Log In</a>
    </div>
  </div>
</div>
{% endblock %}
