{% extends "base.html" %}

{% block title %}Sign In — Placement Readiness Predictor{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--primary);">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.3rem;">Sign in to access your placement predictor dashboard</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter username or email" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem;">
        Sign In to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create an Account</a>
    </div>
  </div>
</div>
{% endblock %}
